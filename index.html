<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#EEF1EC">
<title>N1 Kanji</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#EEF1EC;--surface:#FBFCF9;--ink:#1F3A5F;--soft:#5A6B80;--line:#D3DACF;--gold:#A8741A}
@media (prefers-color-scheme:dark){:root{--paper:#141A22;--surface:#1C2430;--ink:#DCE5F0;--soft:#93A3B6;--line:#2C3746;--gold:#E0B25A}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans","Noto Sans JP",system-ui,sans-serif}
.w{max-width:560px;margin:0 auto;padding:40px 18px}
.e{font:700 .85rem "Noto Sans JP",sans-serif;letter-spacing:.06em;color:var(--gold);margin:0 0 6px}
h1{font:700 clamp(1.8rem,6vw,2.4rem) "Noto Sans JP",sans-serif;margin:0 0 6px}
p.s{color:var(--soft);margin:0 0 26px}
a.c{display:block;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:12px;text-decoration:none;color:inherit;font:700 1.2rem "Noto Sans JP","Noto Sans",sans-serif}
a.c:hover,a.c:focus-visible{border-color:var(--ink)}
#msg{color:var(--soft)}
</style></head><body><div class="w">
<p class="e">総まとめ N1 漢字</p><h1>Thẻ ghi nhớ Kanji N1</h1><p class="s">Chọn bài để học</p>
<div id="list"><p id="msg">Đang tải danh sách…</p></div>
</div>
<script>
const owner=location.hostname.endsWith("github.io")?location.hostname.split(".")[0]:"min3-1";
const repo=location.hostname.endsWith("github.io")&&location.pathname.split("/")[1]?location.pathname.split("/")[1]:"kanji-n1";
const box=document.getElementById("list");
fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`)
 .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
 .then(files=>{
  const items=files.filter(f=>f.type==="file"&&/\.html?$/i.test(f.name)&&f.name.toLowerCase()!=="index.html")
   .sort((a,b)=>a.name.localeCompare(b.name,"vi",{numeric:true}));
  box.innerHTML="";
  if(!items.length){box.innerHTML='<p id="msg">Chưa có bài nào.</p>';return;}
  items.forEach(f=>{const a=document.createElement("a");a.className="c";a.href=encodeURIComponent(f.name);a.textContent=f.name.replace(/\.html?$/i,"");box.appendChild(a);});
 })
 .catch(()=>{box.innerHTML='<p id="msg">Không tải được danh sách bài. Hãy thử tải lại trang sau vài phút.</p>';});
</script></body></html>
